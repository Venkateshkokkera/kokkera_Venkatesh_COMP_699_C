{% extends "base.html" %}
{% block content %}
  <h2>{% if edit %}Edit{% else %}Log{% endif %} Health Data</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">{% if edit %}Update{% else %}Save{% endif %}</button>
    <a class="btn btn-secondary" href="{% url 'health:dashboard' %}">Cancel</a>
  </form>
{% endblock %}
